name: Feature Request
description: Suggest an idea or enhancement for the UPSC Learning Platform
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe concisely.
      placeholder: I am frustrated when...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or capability you would like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      required: false
  - type: textarea
    id: security-impact
    attributes:
      label: Security or Database Migration Impact
      description: Does this feature require new database tables, RLS policy changes, environment variables, or API endpoint additions?
    validations:
      required: false
